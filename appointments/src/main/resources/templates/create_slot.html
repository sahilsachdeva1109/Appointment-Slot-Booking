<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Slot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>Create Slot</h2>
  <form th:action="@{/slots/create}" th:object="${slot}" method="post">
    <div class="mb-3">
      <label>Date</label>
      <input type="date" th:field="*{date}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Start Time</label>
      <input type="time" th:field="*{startTime}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>End Time</label>
      <input type="time" th:field="*{endTime}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Slot</button>
    <a href="/" class="btn btn-link">Back</a>
  </form>
</div>
</body>
</html>
