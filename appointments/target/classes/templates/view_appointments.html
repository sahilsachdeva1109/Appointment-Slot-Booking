<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Appointments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>All Appointments</h2>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>User</th>
      <th>Slot</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="appointment : ${appointments}">
      <td th:text="${appointment.id}"></td>
      <td th:text="${appointment.user != null ? appointment.user.name + ' (' + appointment.user.email + ')' : 'N/A'}"></td>
      <td th:text="${appointment.slot != null ? appointment.slot.date + ' ' + appointment.slot.startTime + '-' + appointment.slot.endTime : 'N/A'}"></td>
      <td th:text="${appointment.status}"></td>
      <td>
        <form th:action="@{'/appointments/cancel/' + ${appointment.id}}" method="post"
              th:if="${appointment.status == 'BOOKED'}">
          <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
        </form>
        <span th:if="${appointment.status != 'BOOKED'}">-</span>
      </td>
    </tr>
    </tbody>
  </table>
  <a href="/" class="btn btn-link mt-3">Back to Home</a>
</div>
</body>
</html>
